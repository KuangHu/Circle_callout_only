name: control-plane-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q circlestream stream.py run_rule.py
      - run: bash -n scripts/install-tools.sh scripts/preflight-cluster.sh
      - run: python -m pip install 'snakemake>=8.25,<8.26'
      - run: python scripts/check_dag.py
